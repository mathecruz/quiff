# The page exposes the repository's source code, so never listen beyond this machine.
quarkus.http.host=localhost
quarkus.http.port=8790
quarkus.banner.enabled=false

# Repository to compare; bin/quiff passes the current repo's top-level directory.
quiff.repo=${user.dir}

# bin/quiff prints the URL itself; only show Quarkus logs when something goes wrong.
quarkus.log.level=WARN
